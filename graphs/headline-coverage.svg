<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430"
     viewBox="0 0 1200 430" role="img"
     aria-labelledby="title description">
  <title id="title">Rush correctness coverage across three upstream trees</title>
  <desc id="description">Three complete bars show 463 of 463 TensorFlow CPU
  tests, 4,175 of 4,175 Modular Bazel-buildable targets, and 12,397 of 12,397
  Linux persistent output entries in their separately defined scopes.</desc>
  <defs>
    <style>
      .title { font: 700 27px 'DejaVu Sans', sans-serif; fill: #172033; }
      .subtitle { font: 15px 'DejaVu Sans', sans-serif; fill: #596579; }
      .name { font: 700 21px 'DejaVu Sans', sans-serif; fill: #172033; }
      .count { font: 700 29px 'DejaVu Sans', sans-serif; fill: #1f5fa9; }
      .scope { font: 14px 'DejaVu Sans', sans-serif; fill: #3f4b5f; }
      .tag { font: 12px 'DejaVu Sans', sans-serif; fill: #596579; }
      .axis { stroke: #dce2ea; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="430" fill="#ffffff"/>
  <text x="60" y="52" class="title">Rush build correctness at a glance</text>
  <text x="60" y="80" class="subtitle">Complete within each named scope; denominators differ and are not timing comparisons</text>

  <rect x="52" y="108" width="344" height="267" rx="12" fill="#f6f8fb" stroke="#dce2ea"/>
  <text x="78" y="148" class="name">TensorFlow 2.15</text>
  <text x="78" y="188" class="count">463 / 463</text>
  <text x="78" y="216" class="scope">CPU tf_cc_test targets</text>
  <text x="78" y="237" class="scope">build and pass at runtime</text>
  <rect x="78" y="267" width="292" height="20" rx="10" fill="#dce2ea"/>
  <rect x="78" y="267" width="292" height="20" rx="10" fill="#1f5fa9"/>
  <text x="78" y="318" class="tag">Unmodified upstream source</text>
  <text x="78" y="340" class="tag">100% of the named CPU corpus</text>

  <rect x="428" y="108" width="344" height="267" rx="12" fill="#f6f8fb" stroke="#dce2ea"/>
  <text x="454" y="148" class="name">Modular</text>
  <text x="454" y="188" class="count">4,175 / 4,175</text>
  <text x="454" y="216" class="scope">Bazel-buildable targets</text>
  <text x="454" y="237" class="scope">also build under Rush</text>
  <rect x="454" y="267" width="292" height="20" rx="10" fill="#dce2ea"/>
  <rect x="454" y="267" width="292" height="20" rx="10" fill="#1f5fa9"/>
  <text x="454" y="318" class="tag">Pinned public whole-repo tree</text>
  <text x="454" y="340" class="tag">100% of the Bazel-green ledger</text>

  <rect x="804" y="108" width="344" height="267" rx="12" fill="#f6f8fb" stroke="#dce2ea"/>
  <text x="830" y="148" class="name">Linux Kbuild</text>
  <text x="830" y="188" class="count">12,397 / 12,397</text>
  <text x="830" y="216" class="scope">Persistent output entries</text>
  <text x="830" y="237" class="scope">match the Make oracle exactly</text>
  <rect x="830" y="267" width="292" height="20" rx="10" fill="#dce2ea"/>
  <rect x="830" y="267" width="292" height="20" rx="10" fill="#1f5fa9"/>
  <text x="830" y="318" class="tag">Lorenzo v1 baseline, unchanged Kbuild</text>
  <text x="830" y="340" class="tag">Bytes, types, modes, and symlinks</text>

  <line x1="60" y1="403" x2="1140" y2="403" class="axis"/>
  <text x="60" y="424" class="tag">Acceptance scopes are independently defined; see each status page for procedures and open gates.</text>
</svg>
