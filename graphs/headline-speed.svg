<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560"
     viewBox="0 0 1200 560" role="img"
     aria-labelledby="title description">
  <title id="title">Measured Rush speed benefits by workload and build mode</title>
  <desc id="description">TensorFlow warm no-op is 6.9 times faster. Modular
  measurements range from 1.2 times for a novel one-file edit to 252 times
  for a warm no-op, with 1.7 times clean compile and 2.0 times cache restore
  results. Linux populated-cache replay is 1.265 times faster than clean Make
  in three scouting pairs, while empty-cache Rush is slower.</desc>
  <defs>
    <style>
      .title { font: 700 27px 'DejaVu Sans', sans-serif; fill: #172033; }
      .subtitle { font: 15px 'DejaVu Sans', sans-serif; fill: #596579; }
      .name { font: 700 21px 'DejaVu Sans', sans-serif; fill: #172033; }
      .speed { font: 700 38px 'DejaVu Sans', sans-serif; fill: #1f5fa9; }
      .mode { font: 700 14px 'DejaVu Sans', sans-serif; fill: #3f4b5f; }
      .value { font: 13px 'DejaVu Sans', sans-serif; fill: #3f4b5f; }
      .small { font: 12px 'DejaVu Sans', sans-serif; fill: #596579; }
      .warning { font: 700 12px 'DejaVu Sans', sans-serif; fill: #9a5910; }
      .divider { stroke: #dce2ea; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="60" y="48" class="title">Measured speed benefits depend on build mode</text>
  <text x="60" y="77" class="subtitle">Selected head-to-head medians; each ratio applies only to the scope printed beneath it</text>

  <rect x="52" y="105" width="344" height="386" rx="12" fill="#f6f8fb" stroke="#dce2ea"/>
  <text x="78" y="145" class="name">TensorFlow 2.15</text>
  <text x="78" y="197" class="speed">6.9x</text>
  <text x="78" y="225" class="mode">WARM NO-OP</text>
  <text x="78" y="254" class="value">Rush 9.3 ms</text>
  <text x="78" y="276" class="value">Bazel 64.2 ms</text>
  <line x1="78" y1="298" x2="370" y2="298" class="divider"/>
  <text x="78" y="326" class="small">30 samples, p50</text>
  <text x="78" y="347" class="small">18,522 retained dependencies</text>
  <text x="78" y="368" class="small">//tensorflow/core:framework</text>
  <rect x="78" y="403" width="292" height="41" rx="7" fill="#e8edf4"/>
  <text x="91" y="421" class="small">No changed input; not a cold,</text>
  <text x="91" y="438" class="small">incremental, or full-tree claim</text>

  <rect x="428" y="105" width="344" height="386" rx="12" fill="#f6f8fb" stroke="#dce2ea"/>
  <text x="454" y="145" class="name">Modular whole repo</text>
  <text x="454" y="194" class="speed">1.2x - 252x</text>
  <text x="454" y="225" class="mode">MEASURED MODES</text>
  <text x="454" y="257" class="mode">1.7x</text>
  <text x="511" y="257" class="value">clean compile</text>
  <text x="650" y="257" class="small">362 vs 611 s</text>
  <text x="454" y="294" class="mode">2.0x</text>
  <text x="511" y="294" class="value">cache restore</text>
  <text x="650" y="294" class="small">32 vs 63 s</text>
  <text x="454" y="331" class="mode">1.2x</text>
  <text x="511" y="331" class="value">novel one-file edit</text>
  <text x="650" y="331" class="small">26.0 vs 30.1 s</text>
  <text x="454" y="368" class="mode">252x</text>
  <text x="511" y="368" class="value">warm no-op</text>
  <text x="650" y="368" class="small">0.05 vs 12.6 s</text>
  <line x1="454" y1="394" x2="746" y2="394" class="divider"/>
  <text x="454" y="421" class="small">Rush vs Bazel on the same pinned</text>
  <text x="454" y="442" class="small">4,175-target public tree</text>

  <rect x="804" y="105" width="344" height="386" rx="12" fill="#f6f8fb" stroke="#dce2ea"/>
  <text x="830" y="145" class="name">Linux Kbuild</text>
  <text x="830" y="197" class="speed">1.265x</text>
  <text x="830" y="225" class="mode">POPULATED-CACHE REPLAY</text>
  <text x="830" y="254" class="value">Rush 40.24 s</text>
  <text x="830" y="276" class="value">Lorenzo-v1 Make 50.92 s</text>
  <line x1="830" y1="298" x2="1122" y2="298" class="divider"/>
  <text x="830" y="326" class="small">Three alternating pairs, median</text>
  <text x="830" y="347" class="small">Exact output parity in every pair</text>
  <text x="830" y="376" class="warning">SCOUTING RESULT</text>
  <text x="830" y="398" class="small">10-pair 95% CI certificate pending</text>
  <rect x="830" y="416" width="292" height="41" rx="7" fill="#fff0dd"/>
  <text x="843" y="434" class="warning">Empty-cache Rush is slower</text>
  <text x="843" y="451" class="small">No uncached speedup claim</text>

  <line x1="60" y1="520" x2="1140" y2="520" class="divider"/>
  <text x="60" y="544" class="small">Ratios compare Rush with the named reference only within each printed mode; they are not interchangeable.</text>
</svg>
